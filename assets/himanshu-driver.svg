<svg viewBox="0 0 720 960" width="720" height="960" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="driverTitle">
  <title id="driverTitle">Stylized illustration of a racing driver in red gear and a helmet</title>
  <defs>
    <radialGradient id="helmetShine" cx="34%" cy="24%" r="78%">
      <stop offset="0%" stop-color="#ff5b52" />
      <stop offset="48%" stop-color="#ff2a22" />
      <stop offset="100%" stop-color="#a80400" />
    </radialGradient>
    <linearGradient id="visorGloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a4250" />
      <stop offset="42%" stop-color="#0c0d10" />
      <stop offset="100%" stop-color="#08090b" />
    </linearGradient>
    <linearGradient id="suitShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2a22" />
      <stop offset="55%" stop-color="#e10600" />
      <stop offset="100%" stop-color="#7d0400" />
    </linearGradient>
    <linearGradient id="fadeMask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="80%" stop-color="#fff" />
      <stop offset="100%" stop-color="#000" />
    </linearGradient>
    <mask id="bottomFade">
      <rect x="0" y="0" width="720" height="960" fill="url(#fadeMask)" />
    </mask>
    <clipPath id="torsoClip">
      <path d="M 208,562 A 224 92 0 0 1 592,556 L 566,900 L 234,900 Z" />
    </clipPath>
  </defs>

  <g mask="url(#bottomFade)">
    <!-- ambient ground glow -->
    <ellipse cx="398" cy="905" rx="185" ry="30" fill="#e10600" opacity="0.16" />

    <!-- torso / body group -->
    <g id="driver-body">
      <!-- neck / collar -->
      <path d="M 345,340 L 455,340 L 492,572 L 308,572 Z" fill="#111114" />

      <!-- torso / racing suit -->
      <path d="M 208,562 A 224 92 0 0 1 592,556 L 566,900 L 234,900 Z" fill="url(#suitShade)" />

      <g clip-path="url(#torsoClip)">
        <!-- diagonal livery stripes -->
        <path d="M 252,556 L 316,556 L 432,900 L 368,900 Z" fill="#f4f1eb" opacity="0.94" />
        <path d="M 316,556 L 362,556 L 478,900 L 432,900 Z" fill="#09090a" opacity="0.88" />
        <!-- blank sponsor patches (no branding/text, purely decorative) -->
        <rect x="470" y="600" width="66" height="24" rx="4" fill="#d8d5cf" opacity="0.85" />
        <rect x="470" y="636" width="48" height="16" rx="3" fill="#111114" opacity="0.7" />
        <rect x="228" y="612" width="52" height="18" rx="3" fill="#111114" opacity="0.7" />
      </g>

      <!-- chest number patch, echoes the "5+ years" stat in the tech sheet -->
      <circle cx="398" cy="642" r="44" fill="#f4f1eb" stroke="#111114" stroke-width="5" />
      <text x="398" y="659" font-family="Arial, sans-serif" font-size="46" font-weight="900" fill="#09090a" text-anchor="middle">05</text>
    </g>

    <!-- head / helmet group (animated on mouse move) -->
    <g id="driver-head" style="transform-origin: 398px 228px;">
      <!-- helmet dome -->
      <ellipse cx="398" cy="228" rx="150" ry="144" fill="url(#helmetShine)" />

      <!-- helmet racing stripe -->
      <path d="M 384,86 Q 398,84 414,90 L 404,372 L 392,372 Z" fill="#f4f1eb" opacity="0.95" />

      <!-- side vents -->
      <ellipse cx="278" cy="214" rx="15" ry="9" fill="#3a0300" opacity="0.75" />
      <ellipse cx="518" cy="206" rx="15" ry="9" fill="#3a0300" opacity="0.6" />

      <!-- visor -->
      <path d="M 268,246 Q 398,300 528,238 Q 512,320 398,326 Q 284,320 268,246 Z" fill="url(#visorGloss)" />
      <!-- visor gloss streak -->
      <path d="M 300,252 Q 340,296 300,300 Q 276,270 300,252 Z" fill="#e8f4ff" opacity="0.4" />

      <!-- chin guard shadow -->
      <path d="M 320,336 Q 398,362 476,332 Q 460,352 398,358 Q 336,352 320,336 Z" fill="#7a0400" opacity="0.5" />
    </g>
  </g>
</svg>
